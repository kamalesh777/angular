<div class="card flex justify-center" style="margin-top: 50px;">
    <form [formGroup]="todoForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 w-full sm:w-56">
        <div class="flex flex-col gap-1">
            <input pInputText type="text" id="username" placeholder="Enter name" formControlName="name" [invalid]="isInvalid('name')" />
            @if (isInvalid('name')) {
                <p-message severity="error" size="small" variant="simple">Name is required.</p-message>
            }
        </div>
        <button pButton severity="secondary" type="submit"><span pButtonLabel>Submit</span></button>
    </form>
</div>
